    <!-- Floating AI Button -->
    <button onclick="toggleAIChatModal()" class="fixed bottom-[100px] right-6 z-[1000] flex flex-col items-center justify-center w-16 h-16 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full shadow-xl shadow-indigo-500/30 text-white hover:from-blue-700 hover:to-indigo-700 transition-transform hover:scale-105 active:scale-95 group">
      <span class="absolute -top-1 -right-1 flex h-4 w-4">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-4 w-4 bg-sky-500 border border-white"></span>
      </span>
      <i class="fas fa-robot text-2xl mb-0.5 group-hover:animate-bounce"></i>
      <span class="text-[11px] font-bold leading-none mt-0.5">AI Help</span>
    </button>

    <!-- AI Chat Modal -->
    <div id="aiChatModal" class="fixed inset-0 z-[2000] hidden items-end justify-end sm:items-center sm:justify-center font-sans">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="toggleAIChatModal()"></div>
        <div id="aiChatContent" class="relative w-full sm:w-[400px] h-[85vh] sm:h-[600px] bg-slate-50 sm:rounded-3xl shadow-2xl flex flex-col transform translate-y-full sm:translate-y-0 sm:scale-95 opacity-0 transition-all duration-300 overflow-hidden border border-slate-200">
            
            <!-- Header -->
            <div class="flex items-center justify-between p-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md relative z-10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                        <i class="fas fa-robot text-xl text-white"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm">🤖 Bexo AI Assistant</h3>
                        <p class="text-[10px] text-blue-100 flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span> Online
                        </p>
                    </div>
                </div>
                <button onclick="toggleAIChatModal()" class="w-8 h-8 rounded-full hover:bg-white/20 flex items-center justify-center transition-colors">
                    <i class="fas fa-times text-white"></i>
                </button>
            </div>
            
            <!-- Chat Messages Area -->
            <div id="aiChatMessages" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar relative">
                <!-- Welcome Message -->
                <div class="flex justify-start">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-full flex items-center justify-center text-white shrink-0 mt-1 mr-2 shadow-sm">
                        <i class="fas fa-robot text-sm"></i>
                    </div>
                    <div class="max-w-[80%] bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-slate-100">
                        <p class="text-slate-800 text-sm leading-relaxed">আমি Bexo BD-এর AI সহকারী। <br/>আপনি বাংলা অথবা English-এ প্রশ্ন করতে পারেন।</p>
                    </div>
                </div>
            </div>
            
            <!-- Context & Suggestion Chips (Optional, can be used later) -->
            <div class="px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar bg-slate-50 border-t border-slate-200">
                <button onclick="sendAIMessage('আমার ব্যালেন্স দেখাও')" class="whitespace-nowrap px-3 py-1.5 bg-white border border-slate-200 text-slate-600 text-xs font-medium rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition-colors shadow-sm">💰 ব্যালেন্স</button>
                <button onclick="sendAIMessage('আমার শেষ অর্ডার')" class="whitespace-nowrap px-3 py-1.5 bg-white border border-slate-200 text-slate-600 text-xs font-medium rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition-colors shadow-sm">📦 অর্ডার</button>
                <button onclick="sendAIMessage('মোবাইল রিচার্জ')" class="whitespace-nowrap px-3 py-1.5 bg-white border border-slate-200 text-slate-600 text-xs font-medium rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition-colors shadow-sm">📱 রিচার্জ</button>
            </div>
            
            <!-- Input Area -->
            <div class="p-3 bg-white border-t border-slate-200">
                <form id="aiChatForm" class="flex items-center gap-2" onsubmit="handleAIChatSubmit(event)">
                    <!-- Image Upload Label (Optional - handled via the main search maybe?) -->
                    <label for="aiImageUpload" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full cursor-pointer transition-colors shrink-0">
                        <i class="fas fa-image"></i>
                        <input type="file" id="aiImageUpload" accept="image/*" class="hidden" onchange="handleAIImageUpload(event)" />
                    </label>
                    
                    <div class="flex-1 bg-slate-50 border border-slate-200 rounded-full flex items-center px-4 py-1.5 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all shadow-inner">
                        <input type="text" id="aiChatInput" placeholder="আপনি কী করতে চান?" class="w-full bg-transparent border-none outline-none text-sm text-slate-700 py-2 placeholder-slate-400" autocomplete="off" />
                    </div>
                    
                    <button type="submit" id="aiSendBtn" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full flex items-center justify-center shrink-0 shadow-md transition-transform hover:scale-105 active:scale-95 disabled:opacity-50">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        let aiPendingAction = null;

        function toggleAIChatModal() {
            const modal = document.getElementById('aiChatModal');
            const content = document.getElementById('aiChatContent');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => {
                    content.classList.remove('translate-y-full', 'opacity-0');
                    if (window.innerWidth >= 640) content.classList.remove('scale-95');
                }, 10);
            } else {
                content.classList.add('translate-y-full', 'opacity-0');
                if (window.innerWidth >= 640) content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 300);
            }
        }
        
        function appendAIMessage(sender, text) {
            const container = document.getElementById('aiChatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';
            
            if (sender === 'user') {
                msgDiv.innerHTML = \`
                    <div class="max-w-[80%] bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 shadow-sm">
                        <p class="text-sm leading-relaxed whitespace-pre-wrap">\${text}</p>
                    </div>
                \`;
            } else {
                let textHtml = text.replace(/\\n/g, '<br/>');
                msgDiv.innerHTML = \`
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-full flex items-center justify-center text-white shrink-0 mt-1 mr-2 shadow-sm">
                        <i class="fas fa-robot text-sm"></i>
                    </div>
                    <div class="max-w-[80%] bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-slate-100 text-slate-800 text-sm leading-relaxed">
                        \${textHtml}
                    </div>
                \`;
            }
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function appendAILoading() {
            const container = document.getElementById('aiChatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.id = 'aiLoadingBubble';
            msgDiv.className = 'flex justify-start';
            msgDiv.innerHTML = \`
                <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-full flex items-center justify-center text-white shrink-0 mt-1 mr-2 shadow-sm">
                    <i class="fas fa-robot text-sm"></i>
                </div>
                <div class="max-w-[80%] bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-slate-100 flex items-center gap-1.5">
                    <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                </div>
            \`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function removeAILoading() {
            const bubble = document.getElementById('aiLoadingBubble');
            if (bubble) bubble.remove();
        }

        function appendAIConfirmation(msg, actionData) {
            const container = document.getElementById('aiChatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex justify-start';
            
            aiPendingAction = actionData;

            msgDiv.innerHTML = \`
                <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-full flex items-center justify-center text-white shrink-0 mt-1 mr-2 shadow-sm">
                    <i class="fas fa-robot text-sm"></i>
                </div>
                <div class="max-w-[80%] bg-white rounded-2xl rounded-tl-sm p-4 shadow-sm border border-orange-200">
                    <p class="text-slate-800 text-sm leading-relaxed mb-3">\${msg}</p>
                    <div class="flex items-center gap-2">
                        <button onclick="handleAIConfirm(true, this)" class="flex-1 bg-indigo-600 text-white font-bold text-xs py-2 rounded-lg hover:bg-indigo-700 transition-colors">হ্যাঁ, নিশ্চিত করুন</button>
                        <button onclick="handleAIConfirm(false, this)" class="flex-1 bg-slate-100 text-slate-600 font-bold text-xs py-2 rounded-lg hover:bg-slate-200 transition-colors">বাতিল</button>
                    </div>
                </div>
            \`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function handleAIConfirm(isConfirmed, btn) {
            const parent = btn.parentElement;
            parent.innerHTML = isConfirmed 
                ? '<p class="text-emerald-600 text-xs font-bold w-full text-center py-1"><i class="fas fa-check-circle"></i> নিশ্চিত করা হয়েছে</p>' 
                : '<p class="text-slate-400 text-xs font-bold w-full text-center py-1"><i class="fas fa-times"></i> বাতিল করা হয়েছে</p>';
            
            if (isConfirmed && aiPendingAction) {
                executeAIAction(aiPendingAction);
            }
            aiPendingAction = null;
        }

        function getAIContext() {
            return {
                userName: typeof userProfile !== 'undefined' && userProfile ? userProfile.displayName : "Unknown",
                balance: typeof userProfile !== 'undefined' && userProfile ? userProfile.balance : 0,
                activeView: typeof currentMenu !== 'undefined' ? currentMenu : "Unknown",
                orders: typeof appOrders !== 'undefined' ? appOrders : []
            };
        }

        function executeAIAction(action) {
            if (!action || !action.action) return;
            
            if (action.action === 'NAVIGATE') {
                if (typeof switchMenu === 'function') {
                    switchMenu(action.params.menu);
                    toggleAIChatModal(); // Close modal to show the screen
                }
            } else if (action.action === 'LOGOUT') {
                if (typeof logoutUser === 'function') {
                    logoutUser();
                } else if (typeof signOut === 'function' && typeof auth !== 'undefined') {
                    signOut(auth).then(() => { window.location.reload(); });
                }
            } else if (action.action === 'MOBILE_RECHARGE') {
                // Populate the fields and submit!
                const numEl = document.getElementById('rcNumber');
                const amtEl = document.getElementById('rcAmount');
                const opEl = document.getElementById('rcOperator');
                const typeEl = document.getElementById('rcType');
                const btn = document.getElementById('rcSubmitBtn') || document.querySelector('button[onclick*="submitMobileRecharge"]');
                
                if (numEl) numEl.value = action.params.number || '';
                if (amtEl) amtEl.value = action.params.amount || '';
                if (opEl && action.params.operator) opEl.value = action.params.operator;
                if (typeEl && action.params.type) typeEl.value = action.params.type;
                
                if (btn) {
                    if (typeof switchMenu === 'function') switchMenu('recharge');
                    setTimeout(() => {
                        window.submitMobileRecharge(btn);
                    }, 500);
                } else {
                    appendAIMessage('ai', 'দুঃখিত, মোবাইল রিচার্জ অপশনটি এই মুহূর্তে পাওয়া যাচ্ছে না।');
                }
            } else if (action.action === 'SEARCH_IMAGE') {
                 // Trigger image search logic
                 if (typeof processVisualSearch === 'function') {
                     processVisualSearch(action.params.image);
                 }
                 toggleAIChatModal();
            } else if (action.action === 'SHOW_INFO') {
                 // Context already provided the info to AI, nothing special to do in UI unless requested.
            }
        }

        async function sendAIMessage(text) {
            const input = document.getElementById('aiChatInput');
            if (input) input.value = '';
            
            appendAIMessage('user', text);
            appendAILoading();
            
            try {
                const res = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        context: getAIContext()
                    })
                });
                
                removeAILoading();
                
                if (!res.ok) throw new Error('API Error');
                
                const data = await res.json();
                
                if (data.action && data.action.action === 'REQUIRE_CONFIRMATION') {
                    if (data.reply) appendAIMessage('ai', data.reply);
                    appendAIConfirmation(data.action.params.message, data.action.params.pendingAction);
                } else {
                    if (data.reply) appendAIMessage('ai', data.reply);
                    if (data.action) executeAIAction(data.action);
                }
                
            } catch (err) {
                removeAILoading();
                console.error(err);
                appendAIMessage('ai', 'দুঃখিত, কোনো একটি সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।');
            }
        }

        function handleAIChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('aiChatInput');
            const text = input.value.trim();
            if (!text) return;
            sendAIMessage(text);
        }

        function handleAIImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64 = event.target.result;
                
                appendAIMessage('user', '[Image Uploaded] আমাকে এই প্রোডাক্টটি খুঁজে দিন।');
                appendAILoading();
                
                // Directly trigger image search UI
                setTimeout(() => {
                    removeAILoading();
                    appendAIMessage('ai', 'ছবিটি প্রসেস করা হচ্ছে। অনুগ্রহ করে অপেক্ষা করুন...');
                    if (typeof window.processVisualSearch === 'function') {
                        // Assuming the visual search sets the image in some container, we just mock the file input trigger
                        const visualInput = document.getElementById('visualSearchInput');
                        if (visualInput) {
                            // We can't transfer file objects easily, but we can set src to a preview and trigger upload logic
                            // For simplicity, just use base64 if your visual search API accepts it
                            executeAIAction({ action: 'SEARCH_IMAGE', params: { image: base64 } });
                        }
                    }
                }, 1000);
            };
            reader.readAsDataURL(file);
        }
    </script>

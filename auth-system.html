<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Auth Container -->
    <div id="authContainer" class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden animate-fade-in">
        
        <!-- Login Form -->
        <div id="loginForm" class="p-8">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-2xl mx-auto mb-4">
                    <i class="fas fa-lock"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800">Welcome Back</h2>
                <p class="text-sm text-slate-500 mt-1">Please sign in to continue</p>
            </div>

            <div id="loginAlert" class="hidden mb-4 p-3 bg-rose-50 text-rose-600 text-sm font-bold rounded-xl text-center"></div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" id="loginEmail" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium" placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="loginPass" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-black uppercase tracking-widest hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-lg shadow-indigo-200">
                    Sign In
                </button>
            </div>
            
            <p class="text-center mt-6 text-sm text-slate-500 font-medium">
                Don't have an account? <button onclick="toggleView('register')" class="text-indigo-600 font-bold hover:underline">Sign up</button>
            </p>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="p-8 hidden">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-2xl mx-auto mb-4">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800">Create Account</h2>
                <p class="text-sm text-slate-500 mt-1">Join us today to get started</p>
            </div>

            <div id="registerAlert" class="hidden mb-4 p-3 bg-rose-50 text-rose-600 text-sm font-bold rounded-xl text-center"></div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Full Name</label>
                    <input type="text" id="regName" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-medium" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" id="regEmail" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-medium" placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="regPass" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-medium" placeholder="••••••••">
                </div>
                <button onclick="handleRegister()" class="w-full py-3.5 bg-emerald-600 text-white rounded-xl font-black uppercase tracking-widest hover:bg-emerald-700 active:scale-[0.98] transition-all shadow-lg shadow-emerald-200">
                    Sign Up
                </button>
            </div>
            
            <p class="text-center mt-6 text-sm text-slate-500 font-medium">
                Already have an account? <button onclick="toggleView('login')" class="text-emerald-600 font-bold hover:underline">Sign in</button>
            </p>
        </div>
    </div>

    <!-- Dashboard (Hidden by default) -->
    <div id="dashboardContainer" class="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden hidden animate-fade-in">
        <div class="p-8 bg-slate-900 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black">Dashboard</h1>
                <p class="text-sm text-slate-400 mt-1">Placeholder for future database integration</p>
            </div>
            <button onclick="handleLogout()" class="px-5 py-2.5 bg-rose-500 text-white rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-rose-600 transition-all shadow-lg shadow-rose-500/30">
                Logout
            </button>
        </div>
        <div class="p-10 text-center space-y-4">
            <div class="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
                <i class="fas fa-user"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-800" id="welcomeName">User</h2>
            <p class="text-slate-500 font-medium" id="welcomeEmail">user@example.com</p>
            
            <div class="mt-8 p-6 bg-slate-50 rounded-2xl border border-slate-100 max-w-sm mx-auto text-left">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4 border-b border-slate-200 pb-2">Session Data (Local Storage)</h3>
                <pre id="sessionData" class="text-[10px] font-mono text-slate-600 overflow-x-auto"></pre>
            </div>
        </div>
    </div>

    <script>
        // --- Database Placeholder ---
        // In the future, replace this with Firebase/Firestore or your custom backend API calls.
        const DB = {
            getUsers: () => JSON.parse(localStorage.getItem('mock_users') || '[]'),
            saveUsers: (users) => localStorage.setItem('mock_users', JSON.stringify(users)),
            getCurrentSession: () => JSON.parse(localStorage.getItem('mock_session')),
            setSession: (user) => localStorage.setItem('mock_session', JSON.stringify(user)),
            clearSession: () => localStorage.removeItem('mock_session')
        };

        // --- UI Toggles ---
        function toggleView(view) {
            document.getElementById('loginForm').classList.toggle('hidden', view !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', view !== 'register');
            
            // Clear alerts
            document.getElementById('loginAlert').classList.add('hidden');
            document.getElementById('registerAlert').classList.add('hidden');
        }

        function showAlert(form, message) {
            const alertEl = document.getElementById(form + 'Alert');
            alertEl.textContent = message;
            alertEl.classList.remove('hidden');
        }

        // --- Core Functions ---
        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;

            if (!name || !email || !pass) {
                return showAlert('register', 'All fields are required.');
            }

            const users = DB.getUsers();
            
            if (users.find(u => u.email === email)) {
                return showAlert('register', 'Email already exists.');
            }

            const newUser = {
                id: 'USER-' + Date.now(),
                name,
                email,
                password: pass, // In a real app, never store plain-text passwords!
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            DB.saveUsers(users);

            // Auto-login
            DB.setSession(newUser);
            checkSession();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;

            if (!email || !pass) {
                return showAlert('login', 'Please enter email and password.');
            }

            const users = DB.getUsers();
            const user = users.find(u => u.email === email && u.password === pass);

            if (!user) {
                return showAlert('login', 'Invalid email or password.');
            }

            DB.setSession(user);
            checkSession();
        }

        function handleLogout() {
            DB.clearSession();
            
            // Reset forms
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPass').value = '';
            
            checkSession();
        }

        function checkSession() {
            const session = DB.getCurrentSession();
            const authContainer = document.getElementById('authContainer');
            const dashContainer = document.getElementById('dashboardContainer');

            if (session) {
                authContainer.classList.add('hidden');
                dashContainer.classList.remove('hidden');
                
                // Populate Dashboard
                document.getElementById('welcomeName').textContent = 'Welcome, ' + session.name;
                document.getElementById('welcomeEmail').textContent = session.email;
                document.getElementById('sessionData').textContent = JSON.stringify(session, null, 2);
            } else {
                authContainer.classList.remove('hidden');
                dashContainer.classList.add('hidden');
                toggleView('login');
            }
        }

        // Initialize
        checkSession();
    </script>
</body>
</html>
